substitutions:
  name: espwebcam
  friendly_name: ESPWebCAM

packages:
  esphome.bluetooth-proxy: "github://esphome/bluetooth-proxies/esp32-generic/esp32-generic.yaml@main"

esphome:
  name: espwebcam
  friendly_name: ESPWebCam
  min_version: 2024.11.0
  name_add_mac_suffix: false
  project:
    name: meshwork.camera
    version: "1.0"

  on_boot:
    priority: -100
    then:
      - light.turn_off: esp_cam_light
      - light.turn_off: esp_cam_led
      - mqtt.publish:
          topic: system/announce
          payload: !lambda |-
            return "{\"device_id\":\"espwebcam_01\","
                   "\"type\":\"camera\","
                   "\"capabilities\":[\"stream\",\"snapshot\",\"light\",\"status\"],"
                   "\"version\":\"1.0\"}";

esp32:
  board: esp32cam
  framework:
    type: esp-idf
    version: recommended
    sdkconfig_options:
      CONFIG_LWIP_MAX_SOCKETS: "16"
      CONFIG_HTTPD_MAX_OPEN_SOCKETS: "7"
      CONFIG_HTTPD_ENABLE_SO_LINGER: "y"
      CONFIG_LWIP_TCP_MSL: "1000"
      CONFIG_LWIP_TCP_FIN_WAIT_TIMEOUT: "2000"

psram:
  mode: quad
  speed: 80MHz

logger:
  level: WARN
  baud_rate: 0

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true
  power_save_mode: none
  output_power: 17dB
  reboot_timeout: 0s

api:
  services:
    - service: camera_set_param
      variables:
        name: string
        value: int
      then:
        - lambda: |-
            bool ok = false;
            auto cam = id(espcam);

            if ((name == "contrast") && (value >= -2) && (value <= 2)) { cam->set_contrast(value); ok = true; }
            else if ((name == "brightness") && (value >= -2) && (value <= 2)) { cam->set_brightness(value); ok = true; }
            else if ((name == "saturation") && (value >= -2) && (value <= 2)) { cam->set_saturation(value); ok = true; }

            if (ok) cam->update_camera_parameters();
            else ESP_LOGW("meshwork", "Param out of range");

mqtt:
  id: mqtt_client
  broker: 192.168.50.227
  username: !secret mqtt_username
  password: !secret mqtt_password
  discovery: false
  keepalive: 30s
  birth_message:
    topic: device/espwebcam_01/status
    payload: online
  will_message:
    topic: device/espwebcam_01/status
    payload: offline

ota:
  - platform: esphome

# ---------------------------
# CAMERA SERVER
# ---------------------------

esp32_camera_web_server:
  - port: 8080
    mode: stream
  - port: 8081
    mode: snapshot

esp32_camera:
  id: espcam
  name: espwebcam_01_camera

  external_clock:
    pin: GPIO0
    frequency: 10MHz
  i2c_pins:
    sda: GPIO26
    scl: GPIO27
  data_pins: [GPIO5, GPIO18, GPIO19, GPIO21, GPIO36, GPIO39, GPIO34, GPIO35]
  vsync_pin: GPIO25
  href_pin: GPIO23
  pixel_clock_pin: GPIO22
  power_down_pin: GPIO32

  resolution: 640x480
  jpeg_quality: 12
  max_framerate: 0.5fps
  idle_framerate: 0.2fps

  vertical_flip: false
  horizontal_mirror: false

  aec_mode: auto
  aec2: false
  ae_level: 0
  aec_value: 300
  agc_mode: auto
  agc_gain_ceiling: 2x
  agc_value: 0
  wb_mode: auto

# ---------------------------
# OUTPUTS
# ---------------------------

output:
  - platform: ledc
    channel: 2
    pin: GPIO4
    id: esp_cam_led_pwm

  - platform: gpio
    pin:
      number: GPIO33
      inverted: true
    id: esp_cam_led_gpio

light:
  - platform: monochromatic
    id: esp_cam_light
    name: espwebcam_01_light
    output: esp_cam_led_pwm
    restore_mode: ALWAYS_OFF

  - platform: binary
    id: esp_cam_led
    name: espwebcam_01_led
    output: esp_cam_led_gpio
    restore_mode: ALWAYS_OFF

switch:
  - platform: restart
    id: restart_switch
    name: espwebcam_01_restart

binary_sensor:
  - platform: status
    id: status_sensor
    name: espwebcam_01_status

sensor:
  - platform: wifi_signal
    id: wifi_signal_sensor
    name: espwebcam_01_wifi
    update_interval: 60s

interval:
  - interval: 60s
    then:
      - mqtt.publish:
          topic: device/espwebcam_01/heartbeat
          payload: "alive"
