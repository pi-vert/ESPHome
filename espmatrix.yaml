# Board: Generic ESP32-S3 Board (Generic)
# Definition: definitions/boards/generic-esp32s3/manifest.yaml

substitutions:
  device_id: espmatrix
  device_type: led_matrix
  firmware_version: "1.1.0"

packages:
  mqtt_standard: !include packages/mqtt.yaml

esphome:
  name: espmatrix
  friendly_name: ESPMatrix
  on_boot:
    priority: -10
    then:
      - light.turn_on:
          id: matrix
          effect: "RGB RAW"
          brightness: 15%

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3  
  framework:
    type: arduino
    
api:
  encryption:
    key: !secret espmatrix_api_encryption_key

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: ESPMatrix Fallback Hotspot
    password: !secret espmatrix_fallback_ap_password

captive_portal:

# Enable logging
logger:

globals:
  - id: pixels
    type: uint8_t[64][3]
  - id: dirty
    type: bool
    initial_value: "false"

mqtt:
  # Alias CSV historique. Le port annoncé utilise le JSON typé ci-dessous.
  on_message:
    - topic: matrix/frame
      then:
        - lambda: |-
            int i = 0, val = 0, chan = 0;

            for (char c : x) {
              if (c >= '0' && c <= '9') {
                val = val * 10 + (c - '0');
              } else if (c == ',' || c == ';') {
                id(pixels)[i][chan++] = val;
                val = 0;
                if (chan == 3) {
                  chan = 0;
                  i++;
                  if (i >= 64) break;
                }
              }
            }
            id(dirty) = true;

  on_json_message:
    - topic: ${mqtt_prefix}/actuator/frame/set
      qos: 0
      then:
        - lambda: |-
            if (!x["pixels"].is<JsonArray>()) return;
            const auto pixels = x["pixels"].as<JsonArray>();
            if (pixels.size() != 192) return;
            for (JsonVariant value : pixels) {
              if (!value.is<int>() || value.as<int>() < 0 || value.as<int>() > 255) return;
            }
            for (size_t i = 0; i < 192; i++) id(pixels)[i / 3][i % 3] = pixels[i].as<uint8_t>();
            id(dirty) = true;

script:
  - id: mqtt_announce
    then:
      - lambda: |-
          auto describe = [](JsonObject root) {
            mqtt_standard::announcement(root, "${device_id}", "${device_type}", "${firmware_version}", "${mqtt_prefix}");
            root["label"] = "Matrice RGB 8×8";
            auto input = mqtt_standard::input(root, "${mqtt_prefix}", "frame", "json");
            input["label"] = "Image RGB";
            input["description"] = "192 composantes R,G,B, de 0 à 255, dans pixels";
            auto schema = input["schema"].to<JsonObject>();
            schema["type"] = "object";
            schema["required"].to<JsonArray>().add("pixels");
            schema["additionalProperties"] = false;
            auto pixels = schema["properties"]["pixels"].to<JsonObject>();
            pixels["type"] = "array"; pixels["minItems"] = 192; pixels["maxItems"] = 192;
            auto item = pixels["items"].to<JsonObject>();
            item["type"] = "integer"; item["minimum"] = 0; item["maximum"] = 255;
          };
          id(mqtt_client).publish_json("${mqtt_prefix}/announce", describe, 1, true);
          id(mqtt_client).publish_json("system/announce", describe, 1, false);
  - id: mqtt_snapshot
    then:
      - lambda: |-
          id(mqtt_client).publish_json("${mqtt_prefix}/state", [](JsonObject root) {
            mqtt_standard::envelope(root, "${device_id}", "${device_type}", "${firmware_version}");
            root["frame_pending"] = id(dirty);
          }, 0, true);

# -------------------------------------------------
# MATRICE LED 8x8 WS2812
# -------------------------------------------------

light:
  - platform: neopixelbus
    id: matrix
    pin: GPIO14
    num_leds: 64
    type: GRB
    variant: WS2812
    restore_mode: ALWAYS_ON
    gamma_correct: 2.8

    effects:
      - addressable_lambda:
          name: "RGB RAW"
          update_interval: 100ms   # ⬅️ clé anti-scintillement
          lambda: |-
            if (!id(dirty)) return;

            for (int y = 0; y < 8; y++) {
              for (int x = 0; x < 8; x++) {

                int src = y * 8 + x;
                int dst = (7 - y) * 8 + (7 - x);  // rotation 180°

                it[dst] = Color(
                  id(pixels)[src][0],
                  id(pixels)[src][1],
                  id(pixels)[src][2]
                );
              }
            }

            id(dirty) = false;
