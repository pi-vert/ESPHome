# Contrat MQTT v1 : voir docs/MQTT_STANDARD.md.
# Le fichier appareil fournit mqtt_announce et mqtt_snapshot.
substitutions:
  mqtt_prefix: device/${device_id}
  mqtt_discovery: "false"
  snapshot_interval: 5s

esphome:
  includes:
    - includes/mqtt_standard.h

api:
  reboot_timeout: 0s

mqtt:
  id: mqtt_client
  broker: 192.168.50.227
  username: !secret mqtt_username
  password: !secret mqtt_password
  topic_prefix: ${mqtt_prefix}
  discovery: ${mqtt_discovery}
  clean_session: true
  keepalive: 30s
  reboot_timeout: 0s
  publish_nan_as_none: true
  log_topic: null
  birth_message:
    topic: ${mqtt_prefix}/status
    payload: online
    qos: 1
    retain: true
  will_message:
    topic: ${mqtt_prefix}/status
    payload: offline
    qos: 1
    retain: true
  shutdown_message:
    topic: ${mqtt_prefix}/status
    payload: offline
    qos: 1
    retain: true
  on_connect:
    then:
      - script.execute: mqtt_announce
      - script.execute: mqtt_snapshot
  on_message:
    - topic: system/discover
      qos: 1
      payload: announce
      then:
        - script.execute: mqtt_announce
        - script.execute: mqtt_snapshot

interval:
  - interval: 60s
    then:
      - if:
          condition:
            mqtt.connected:
          then:
            - mqtt.publish:
                topic: ${mqtt_prefix}/heartbeat
                payload: alive
                qos: 0
                retain: false
            - script.execute: mqtt_announce
  - interval: ${snapshot_interval}
    then:
      - if:
          condition:
            mqtt.connected:
          then:
            - script.execute: mqtt_snapshot
