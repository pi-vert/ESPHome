# ESP32-C3 Super Mini + APDS9960 ; contrat : docs/MQTT_STANDARD.md.
substitutions:
  device_id: espgesture
  device_type: gesture
  firmware_version: "1.2.0"
  sensor_interval: 1s
  snapshot_interval: 5s
  debug_interval: 2s
  gesture_window: 250ms

packages:
  mqtt_standard: !include packages/mqtt.yaml

esphome:
  name: espgesture
  friendly_name: ESPGesture
  min_version: 2026.9.0
  name_add_mac_suffix: false
  includes:
    - includes/gesture_window.h

esp32:
  variant: esp32c3
  flash_size: 4MB
  framework:
    type: esp-idf

logger:
  level: INFO

api:
  encryption:
    key: !secret espgesture_api_encryption_key

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: ESPGesture Fallback Hotspot
    password: !secret espgesture_fallback_ap_password
  reboot_timeout: 0s

captive_portal:

mqtt:
  # Ne pas transformer une fenêtre commencée hors connexion en événement neuf.
  on_connect:
    then:
      - script.stop: resolve_gesture_window
      - lambda: mqtt_standard::gesture_votes = mqtt_standard::GestureWindow{};
  on_disconnect:
    then:
      - script.stop: resolve_gesture_window
      - lambda: mqtt_standard::gesture_votes = mqtt_standard::GestureWindow{};

status_led:
  pin: GPIO8

i2c:
  id: bus_a
  sda: GPIO4
  scl: GPIO3
  scan: false

apds9960:
  address: 0x39
  update_interval: ${sensor_interval}
  led_drive: 100mA
  proximity_gain: 4x
  ambient_light_gain: 4x
  gesture_led_drive: 100mA
  gesture_gain: 4x
  gesture_wait_time: 2.8ms

text_sensor:
  - platform: wifi_info
    ip_address:
      id: wifi_ip
      internal: true
  # Un état mémorisé pour l'affichage, distinct de l'événement déclencheur.
  - platform: template
    id: relevant_gesture
    name: ${device_id}_relevant_gesture
    update_interval: never
    state_topic: ${mqtt_prefix}/sensor/last_gesture/state
    qos: 0
    retain: true

sensor:
  # Le composant MQTT natif publie une seule fois, sur le topic explicite.
  - platform: apds9960
    id: clear_channel
    type: CLEAR
    name: ${device_id}_clear
    accuracy_decimals: 1
    state_topic: ${mqtt_prefix}/sensor/clear/state
    qos: 0
    retain: true
  - platform: apds9960
    id: proximity_sensor
    type: PROXIMITY
    name: ${device_id}_proximity
    accuracy_decimals: 1
    state_topic: ${mqtt_prefix}/sensor/proximity/state
    qos: 0
    retain: true
  - platform: apds9960
    id: red_sensor
    type: RED
    name: ${device_id}_red
    accuracy_decimals: 1
    state_topic: ${mqtt_prefix}/sensor/red/state
    qos: 0
    retain: true
  - platform: apds9960
    id: green_sensor
    type: GREEN
    name: ${device_id}_green
    accuracy_decimals: 1
    state_topic: ${mqtt_prefix}/sensor/green/state
    qos: 0
    retain: true
  - platform: apds9960
    id: blue_sensor
    type: BLUE
    name: ${device_id}_blue
    accuracy_decimals: 1
    state_topic: ${mqtt_prefix}/sensor/blue/state
    qos: 0
    retain: true
  - platform: wifi_signal
    id: wifi_signal_sensor
    name: ${device_id}_wifi
    update_interval: 60s
    accuracy_decimals: 0
    state_topic: ${mqtt_prefix}/sensor/wifi/state
    qos: 0
    retain: true

binary_sensor:
  - platform: apds9960
    id: gesture_up
    direction: UP
    name: ${device_id}_gesture_up
    state_topic: ${mqtt_prefix}/binary_sensor/gesture_up/state
    qos: 0
    retain: false
    on_press:
      - script.execute: {id: record_gesture, direction: 1}
  - platform: apds9960
    id: gesture_down
    direction: DOWN
    name: ${device_id}_gesture_down
    state_topic: ${mqtt_prefix}/binary_sensor/gesture_down/state
    qos: 0
    retain: false
    on_press:
      - script.execute: {id: record_gesture, direction: 2}
  - platform: apds9960
    id: gesture_left
    direction: LEFT
    name: ${device_id}_gesture_left
    state_topic: ${mqtt_prefix}/binary_sensor/gesture_left/state
    qos: 0
    retain: false
    on_press:
      - script.execute: {id: record_gesture, direction: 3}
  - platform: apds9960
    id: gesture_right
    direction: RIGHT
    name: ${device_id}_gesture_right
    state_topic: ${mqtt_prefix}/binary_sensor/gesture_right/state
    qos: 0
    retain: false
    on_press:
      - script.execute: {id: record_gesture, direction: 4}
  - platform: status
    id: status_sensor
    name: ${device_id}_status
    state_topic: ${mqtt_prefix}/binary_sensor/status/state
    qos: 0
    retain: true

script:
  - id: mqtt_announce
    then:
      - lambda: |-
          if (!id(mqtt_client).is_connected()) return;
          auto describe = [](JsonObject root) {
            mqtt_standard::announcement(root, "${device_id}", "${device_type}",
                                        "${firmware_version}", "${mqtt_prefix}");
            for (const char *name : {"clear", "proximity", "red", "green", "blue"}) {
              mqtt_standard::output(root, "${mqtt_prefix}", "sensor", name, "float", "%", true);
            }
            mqtt_standard::output(root, "${mqtt_prefix}", "sensor", "wifi", "int", "dBm", true);
            mqtt_standard::output(root, "${mqtt_prefix}", "sensor", "last_gesture", "string", nullptr, true);
            for (const char *name : {"gesture_up", "gesture_down", "gesture_left", "gesture_right"}) {
              mqtt_standard::output(root, "${mqtt_prefix}", "binary_sensor", name, "bool", nullptr, false);
            }
            mqtt_standard::output(root, "${mqtt_prefix}", "binary_sensor", "status", "bool", nullptr, true);
            for (const char *name : {"gesture_raw", "gesture_relevant"}) {
              mqtt_standard::output(root, "${mqtt_prefix}", "event", name, "string", nullptr, false);
            }
            mqtt_standard::output(root, "${mqtt_prefix}", "actuator", "debug_mode", "bool", nullptr, true);
            mqtt_standard::output(root, "${mqtt_prefix}", "actuator", "restart", "bool", nullptr, false);
            auto debug = mqtt_standard::input(root, "${mqtt_prefix}", "debug_mode", "string");
            auto values = debug["values"].to<JsonArray>();
            values.add("ON");
            values.add("OFF");
            auto restart = mqtt_standard::input(root, "${mqtt_prefix}", "restart", "string");
            restart["values"].to<JsonArray>().add("ON");
          };
          id(mqtt_client).publish_json("${mqtt_prefix}/announce", describe, 1, true);
          id(mqtt_client).publish_json("system/announce", describe, 1, false);
          const char *debug_state = id(debug_mode_switch).state ? "enabled" : "disabled";
          id(mqtt_client).publish("${mqtt_prefix}/debug/status", debug_state, strlen(debug_state), 0, true);

  - id: mqtt_snapshot
    then:
      - lambda: |-
          if (!id(mqtt_client).is_connected()) return;
          id(mqtt_client).publish_json("${mqtt_prefix}/state", [](JsonObject root) {
            mqtt_standard::envelope(root, "${device_id}", "${device_type}", "${firmware_version}");
            mqtt_standard::number(root, "clear", id(clear_channel).state);
            mqtt_standard::number(root, "proximity", id(proximity_sensor).state);
            mqtt_standard::number(root, "red", id(red_sensor).state);
            mqtt_standard::number(root, "green", id(green_sensor).state);
            mqtt_standard::number(root, "blue", id(blue_sensor).state);
            mqtt_standard::number(root, "wifi", id(wifi_signal_sensor).state);
            if (id(relevant_gesture).has_state()) root["relevant_gesture"] = id(relevant_gesture).state;
            else root["relevant_gesture"] = nullptr;
            root["debug_mode"] = id(debug_mode_switch).state;
          }, 0, true);

  - id: record_gesture
    parameters:
      direction: int
    then:
      - lambda: |-
          if (!mqtt_standard::gesture_votes.add(direction)) return;
          const char *gesture = mqtt_standard::GestureWindow::label(direction);
          if (id(mqtt_client).is_connected()) {
            id(mqtt_client).publish("${mqtt_prefix}/event/gesture_raw/state", gesture, strlen(gesture), 0, false);
            // Alias explicite pour les clients existants.
            id(mqtt_client).publish("${mqtt_prefix}/gesture/raw", gesture, strlen(gesture), 0, false);
          }
          if (id(debug_mode_switch).state) ESP_LOGI("gesture", "Raw gesture: %s", gesture);
      - if:
          condition:
            not:
              script.is_running: resolve_gesture_window
          then:
            - script.execute: resolve_gesture_window

  - id: resolve_gesture_window
    # Fenêtre bornée depuis le premier geste, sans redémarrage à chaque impulsion.
    mode: single
    then:
      - delay: ${gesture_window}
      - lambda: |-
          const auto result = mqtt_standard::gesture_votes.finish();
          if (result.winner == 0) return;
          const char *relevant = mqtt_standard::GestureWindow::label(result.winner);
          id(relevant_gesture).publish_state(relevant);
          if (id(mqtt_client).is_connected()) {
            id(mqtt_client).publish("${mqtt_prefix}/event/gesture_relevant/state", relevant, strlen(relevant), 0, false);
            id(mqtt_client).publish("${mqtt_prefix}/gesture/relevant", relevant, strlen(relevant), 0, false);
            if (id(debug_mode_switch).state) {
              id(mqtt_client).publish_json("${mqtt_prefix}/debug/gesture_scores", [result, relevant](JsonObject root) {
                mqtt_standard::envelope(root, "${device_id}", "${device_type}", "${firmware_version}");
                root["winner"] = relevant;
                root["up"] = result.scores[0];
                root["down"] = result.scores[1];
                root["left"] = result.scores[2];
                root["right"] = result.scores[3];
                root["best"] = result.best;
                root["ties"] = result.ties;
                root["first_gesture_code"] = result.first;
              }, 0, false);
            }
          }
          if (id(debug_mode_switch).state) ESP_LOGI("gesture", "Relevant gesture: %s", relevant);

interval:
  - interval: ${debug_interval}
    then:
      - lambda: |-
          if (!id(debug_mode_switch).state || !id(mqtt_client).is_connected()) return;
          id(mqtt_client).publish_json("${mqtt_prefix}/debug/state", [](JsonObject root) {
            mqtt_standard::envelope(root, "${device_id}", "${device_type}", "${firmware_version}");
            mqtt_standard::number(root, "clear", id(clear_channel).state);
            mqtt_standard::number(root, "proximity", id(proximity_sensor).state);
            mqtt_standard::number(root, "red", id(red_sensor).state);
            mqtt_standard::number(root, "green", id(green_sensor).state);
            mqtt_standard::number(root, "blue", id(blue_sensor).state);
            mqtt_standard::number(root, "wifi", id(wifi_signal_sensor).state);
            root["gesture_up"] = id(gesture_up).state;
            root["gesture_down"] = id(gesture_down).state;
            root["gesture_left"] = id(gesture_left).state;
            root["gesture_right"] = id(gesture_right).state;
            if (id(relevant_gesture).has_state()) root["relevant_gesture"] = id(relevant_gesture).state;
            else root["relevant_gesture"] = nullptr;
            const auto &scores = mqtt_standard::gesture_votes.scores();
            root["up_score"] = scores[0];
            root["down_score"] = scores[1];
            root["left_score"] = scores[2];
            root["right_score"] = scores[3];
          }, 0, false);

switch:
  - platform: template
    id: debug_mode_switch
    name: ${device_id}_debug_mode
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    state_topic: ${mqtt_prefix}/actuator/debug_mode/state
    command_topic: ${mqtt_prefix}/actuator/debug_mode/set
    qos: 0
    retain: true
    turn_on_action:
      - if:
          condition:
            mqtt.connected:
          then:
            - mqtt.publish:
                topic: ${mqtt_prefix}/debug/status
                payload: enabled
                qos: 0
                retain: true
    turn_off_action:
      - if:
          condition:
            mqtt.connected:
          then:
            - mqtt.publish:
                topic: ${mqtt_prefix}/debug/status
                payload: disabled
                qos: 0
                retain: true
  - platform: restart
    id: restart_switch
    name: ${device_id}_restart
    state_topic: ${mqtt_prefix}/actuator/restart/state
    command_topic: ${mqtt_prefix}/actuator/restart/set
    qos: 0
    retain: false
