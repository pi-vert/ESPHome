substitutions:
  device_id: espwaterlevel_01
  device_type: water_level
  firmware_version: "1.2.0"
  mqtt_discovery: "true"
  hauteur_vide_mm: "63.0"
  seuil_critique_mm: "5.0"
  seuil_bas_mm: "10.0"
  niveau_percent_topic: ${mqtt_prefix}/sensor/niveau_percent/state
  niveau_percent_legacy_topic: ${mqtt_prefix}/sensor/niveau_pourcentage/state

packages:
  mqtt_standard: !include packages/mqtt.yaml

esphome:
  name: espwaterlevel
  friendly_name: ESPWaterLevel
  on_boot:
    priority: -10
    then:
      - script.execute: actualiser_led

esp32:
  board: esp32-s2-saola-1
  variant: esp32s2
  framework:
    type: esp-idf

ota:
  - platform: esphome

wifi:
  id: wifi_network
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: ESPWaterLevel Fallback Hotspot
    password: !secret espwaterlevel_fallback_ap_password

logger:
  level: INFO

api:
  # MQTT est le canal principal ; l'absence d'un client API n'est pas une panne.
  reboot_timeout: 0s

captive_portal:

globals:
  # Validité du dernier écho BRUT, avant que la médiane ignore les NaN.
  - id: mesure_valide
    type: bool
    restore_value: no
    initial_value: 'false'
  # 0 = éteinte, 1 = lent, 2 = rapide ; 255 force l'initialisation.
  - id: mode_led
    type: uint8_t
    restore_value: no
    initial_value: '255'

sensor:
  - platform: ultrasonic
    id: distance_eau_m
    trigger_pin: GPIO18
    echo_pin: GPIO16
    update_interval: 5s
    timeout: 2m
    internal: true
    on_raw_value:
      then:
        - lambda: |-
            id(mesure_valide) = std::isfinite(x) && x >= 0.0f;
    filters:
      - median:
          window_size: 9
          send_every: 1
          send_first_at: 1
      # La médiane peut encore contenir d'anciens échos valides après un timeout.
      # Propager immédiatement l'échec courant au lieu d'afficher une valeur périmée.
      - lambda: |-
          if (!id(mesure_valide) || !std::isfinite(x)) return NAN;
          return x;

  # Chaîne événementielle : un écho -> distance -> niveau -> pourcentage.
  # Aucun timer supplémentaire, aucune dépendance à une mesure vieille de 300 s.
  - platform: copy
    source_id: distance_eau_m
    name: "Distance eau capteur"
    id: distance_eau_mm
    unit_of_measurement: "mm"
    accuracy_decimals: 0
    state_topic: ${mqtt_prefix}/sensor/distance_eau_capteur/state
    qos: 0
    retain: true
    filters:
      - multiply: 1000.0

  - platform: copy
    source_id: distance_eau_mm
    name: "Niveau"
    id: niveau_mm
    unit_of_measurement: "mm"
    accuracy_decimals: 0
    state_topic: ${mqtt_prefix}/sensor/niveau/state
    qos: 0
    retain: true
    filters:
      - lambda: |-
          static_assert(${hauteur_vide_mm} > 0.0, "La hauteur doit etre positive");
          if (!std::isfinite(x)) return NAN;
          const float hauteur = ${hauteur_vide_mm}f;
          return std::clamp(hauteur - x, 0.0f, hauteur);
    on_value:
      then:
        - script.execute: actualiser_led

  - platform: copy
    source_id: niveau_mm
    name: "Niveau Pourcentage"
    id: niveau_percent
    unit_of_measurement: "%"
    accuracy_decimals: 0
    state_topic: ${niveau_percent_topic}
    qos: 0
    retain: true
    filters:
      - lambda: |-
          if (!std::isfinite(x)) return NAN;
          return x * 100.0f / ${hauteur_vide_mm}f;
    on_value:
      then:
        - script.execute: mqtt_percentage_legacy

output:
  - platform: gpio
    pin: GPIO15
    id: led_gpio

light:
  - platform: binary
    id: led
    output: led_gpio
    internal: true
    restore_mode: ALWAYS_OFF
    effects:
      - strobe:
          name: Rapide
          colors:
            - state: true
              duration: 200ms
            - state: false
              duration: 200ms
      - strobe:
          name: Lent
          colors:
            - state: true
              duration: 800ms
            - state: false
              duration: 800ms

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "ESP IP Address"
      id: esp_ip
      state_topic: ${mqtt_prefix}/sensor/esp_ip_address/state
      qos: 0
      retain: true

script:
  - id: mqtt_announce
    then:
      - lambda: |-
          if (!id(mqtt_client).is_connected()) return;
          auto describe = [](JsonObject root) {
            mqtt_standard::announcement(root, "${device_id}", "${device_type}",
                                        "${firmware_version}", "${mqtt_prefix}");
            mqtt_standard::output(root, "${mqtt_prefix}", "sensor", "distance_eau_capteur", "float", "mm", true);
            mqtt_standard::output(root, "${mqtt_prefix}", "sensor", "niveau", "float", "mm", true);
            mqtt_standard::output(root, "${mqtt_prefix}", "sensor", "niveau_percent", "float", "%", true);
            mqtt_standard::output(root, "${mqtt_prefix}", "sensor", "esp_ip_address", "string", nullptr, true);
          };
          id(mqtt_client).publish_json("${mqtt_prefix}/announce", describe, 1, true);
          id(mqtt_client).publish_json("system/announce", describe, 1, false);
      - script.execute: mqtt_percentage_legacy

  - id: mqtt_snapshot
    then:
      - lambda: |-
          if (!id(mqtt_client).is_connected()) return;
          id(mqtt_client).publish_json("${mqtt_prefix}/state", [](JsonObject root) {
            mqtt_standard::envelope(root, "${device_id}", "${device_type}", "${firmware_version}");
            mqtt_standard::number(root, "distance_eau_capteur", id(distance_eau_mm).state);
            mqtt_standard::number(root, "niveau", id(niveau_mm).state);
            mqtt_standard::number(root, "niveau_percent", id(niveau_percent).state);
            root["mesure_valide"] = id(mesure_valide) && std::isfinite(id(niveau_mm).state);
          }, 0, true);

  - id: mqtt_percentage_legacy
    then:
      - lambda: |-
          if (!id(mqtt_client).is_connected()) return;
          const float value = id(niveau_percent).state;
          if (!std::isfinite(value)) {
            id(mqtt_client).publish("${niveau_percent_legacy_topic}", "None", 4, 0, true);
            return;
          }
          // Même format que le composant MQTT natif, pour l'alias historique.
          char payload[VALUE_ACCURACY_MAX_LEN];
          const size_t length = value_accuracy_to_buf(payload, value, 0);
          id(mqtt_client).publish("${niveau_percent_legacy_topic}", payload, length, 0, true);

  - id: actualiser_led
    mode: single
    then:
      - lambda: |-
          static_assert(${seuil_critique_mm} >= 0.0 &&
                        ${seuil_critique_mm} < ${seuil_bas_mm} &&
                        ${seuil_bas_mm} <= ${hauteur_vide_mm},
                        "Seuils de niveau incoherents");
          const float niveau = id(niveau_mm).state;
          uint8_t nouveau_mode = 2;  // Démarrage ou défaut de mesure : alerte rapide.
          if (id(mesure_valide) && std::isfinite(niveau)) {
            nouveau_mode = niveau < ${seuil_critique_mm}f ? 2
                         : niveau < ${seuil_bas_mm}f ? 1 : 0;
          }
          // Ne pas interrompre la phase du clignotement à chaque mesure.
          if (nouveau_mode == id(mode_led)) return;
          id(mode_led) = nouveau_mode;
          auto call = id(led).make_call();
          call.set_state(nouveau_mode != 0);
          call.set_effect(nouveau_mode == 2 ? "Rapide"
                          : nouveau_mode == 1 ? "Lent" : "None");
          call.perform();
