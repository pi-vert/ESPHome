substitutions:
  device_id: espwaterlevel_01
  hauteur_vide_mm: "63.0"
  seuil_critique_mm: "5.0"
  seuil_bas_mm: "10.0"
  mqtt_prefix: device/${device_id}
  # Topic déjà publié par le firmware précédent : conserver les abonnements.
  niveau_percent_topic: ${mqtt_prefix}/sensor/niveau_pourcentage/state

esphome:
  name: espwaterlevel
  friendly_name: ESPWaterLevel
  on_boot:
    priority: -10
    then:
      - script.execute: actualiser_led

esp32:
  board: esp32-s2-saola-1
  variant: esp32s2
  framework:
    type: esp-idf

ota:
  - platform: esphome

wifi:
  id: wifi_network
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: ESPWaterLevel Fallback Hotspot
    password: !secret espwaterlevel_fallback_ap_password

logger:
  level: INFO

api:
  # MQTT est le canal principal ; l'absence d'un client API n'est pas une panne.
  reboot_timeout: 0s

captive_portal:

mqtt:
  broker: 192.168.50.227
  username: !secret mqtt_username
  password: !secret mqtt_password
  reboot_timeout: 0s
  topic_prefix: ${mqtt_prefix}
  on_connect:
    # Annoncer aussi après une reconnexion, sans timer ni drapeau announce_sent.
    - mqtt.publish_json:
        topic: system/announce
        payload: |-
          root["id"] = "${device_id}";
          root["type"] = "sensor";
          root["ip"] = id(wifi_network).get_ip_addresses()[0].str();
          JsonArray outputs = root["outputs"].to<JsonArray>();
          JsonObject output = outputs.add<JsonObject>();
          output["name"] = "niveau_percent";
          output["datatype"] = "float";
          output["unit"] = "%";
          output["topic"] = "${niveau_percent_topic}";

globals:
  # Validité du dernier écho BRUT, avant que la médiane ignore les NaN.
  - id: mesure_valide
    type: bool
    restore_value: no
    initial_value: 'false'
  # 0 = éteinte, 1 = lent, 2 = rapide ; 255 force l'initialisation.
  - id: mode_led
    type: uint8_t
    restore_value: no
    initial_value: '255'

sensor:
  - platform: ultrasonic
    id: distance_eau_m
    trigger_pin: GPIO18
    echo_pin: GPIO16
    update_interval: 5s
    timeout: 2m
    internal: true
    on_raw_value:
      then:
        - lambda: |-
            id(mesure_valide) = std::isfinite(x) && x >= 0.0f;
    filters:
      - median:
          window_size: 9
          send_every: 1
          send_first_at: 1
      # La médiane peut encore contenir d'anciens échos valides après un timeout.
      # Propager immédiatement l'échec courant au lieu d'afficher une valeur périmée.
      - lambda: |-
          if (!id(mesure_valide) || !std::isfinite(x)) return NAN;
          return x;

  # Chaîne événementielle : un écho -> distance -> niveau -> pourcentage.
  # Aucun timer supplémentaire, aucune dépendance à une mesure vieille de 300 s.
  - platform: copy
    source_id: distance_eau_m
    name: "Distance eau capteur"
    id: distance_eau_mm
    unit_of_measurement: "mm"
    accuracy_decimals: 0
    state_topic: ${mqtt_prefix}/sensor/distance_eau_capteur/state
    filters:
      - multiply: 1000.0

  - platform: copy
    source_id: distance_eau_mm
    name: "Niveau"
    id: niveau_mm
    unit_of_measurement: "mm"
    accuracy_decimals: 0
    state_topic: ${mqtt_prefix}/sensor/niveau/state
    filters:
      - lambda: |-
          static_assert(${hauteur_vide_mm} > 0.0, "La hauteur doit etre positive");
          if (!std::isfinite(x)) return NAN;
          const float hauteur = ${hauteur_vide_mm}f;
          return std::clamp(hauteur - x, 0.0f, hauteur);
    on_value:
      then:
        - script.execute: actualiser_led

  - platform: copy
    source_id: niveau_mm
    name: "Niveau Pourcentage"
    id: niveau_percent
    unit_of_measurement: "%"
    accuracy_decimals: 0
    state_topic: ${niveau_percent_topic}
    filters:
      - lambda: |-
          if (!std::isfinite(x)) return NAN;
          return x * 100.0f / ${hauteur_vide_mm}f;

output:
  - platform: gpio
    pin: GPIO15
    id: led_gpio

light:
  - platform: binary
    id: led
    output: led_gpio
    internal: true
    restore_mode: ALWAYS_OFF
    effects:
      - strobe:
          name: Rapide
          colors:
            - state: true
              duration: 200ms
            - state: false
              duration: 200ms
      - strobe:
          name: Lent
          colors:
            - state: true
              duration: 800ms
            - state: false
              duration: 800ms

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "ESP IP Address"
      id: esp_ip

script:
  - id: actualiser_led
    mode: single
    then:
      - lambda: |-
          static_assert(${seuil_critique_mm} >= 0.0 &&
                        ${seuil_critique_mm} < ${seuil_bas_mm} &&
                        ${seuil_bas_mm} <= ${hauteur_vide_mm},
                        "Seuils de niveau incoherents");
          const float niveau = id(niveau_mm).state;
          uint8_t nouveau_mode = 2;  // Démarrage ou défaut de mesure : alerte rapide.
          if (id(mesure_valide) && std::isfinite(niveau)) {
            nouveau_mode = niveau < ${seuil_critique_mm}f ? 2
                         : niveau < ${seuil_bas_mm}f ? 1 : 0;
          }
          // Ne pas interrompre la phase du clignotement à chaque mesure.
          if (nouveau_mode == id(mode_led)) return;
          id(mode_led) = nouveau_mode;
          auto call = id(led).make_call();
          call.set_state(nouveau_mode != 0);
          call.set_effect(nouveau_mode == 2 ? "Rapide"
                          : nouveau_mode == 1 ? "Lent" : "None");
          call.perform();
