# Board: Adafruit ESP32-S2 Feather Development Board
# Definition: definitions/boards/featheresp32-s2/manifest.yaml

esphome:
  name: espwaterlevel
  friendly_name: ESPWaterLevel

esp32:
  variant: esp32s2

logger:

api:
  encryption:
    key: !secret espwaterlevel_api_encryption_key

ota:
